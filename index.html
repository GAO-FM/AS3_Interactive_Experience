<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bulldozer Demolition</title>
<style>
  :root{ --bg:#14161a; --panel:#1d2026; --ink:#f2f2f0; --dim:#a8adb5; --accent:#ffb400; --line:#33373f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;}
  #app{position:fixed; inset:0;}
  #game{position:absolute; inset:0;}
  canvas{display:block;}
  #hud{position:absolute; top:12px; left:12px; z-index:5; display:flex; gap:8px; pointer-events:none;}
  .stat{background:rgba(29,32,38,.9); border:1px solid var(--line); border-left:4px solid var(--accent);
    padding:6px 12px; min-width:88px;}
  .stat span{display:block; font-size:20px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
  .stat label{font-size:10px; letter-spacing:1.5px; color:var(--dim);}
  #speedo{position:absolute; top:12px; right:12px; z-index:5; pointer-events:none; text-align:right;
    background:rgba(29,32,38,.9); border:1px solid var(--line); padding:6px 12px;}
  #speedo b{font-size:20px; font-variant-numeric:tabular-nums;}
  #speedo label{font-size:10px; letter-spacing:1.5px; color:var(--dim); margin-left:4px;}
  #hint{position:absolute; left:12px; bottom:12px; z-index:5; pointer-events:none;
    background:rgba(20,22,26,.85); border:1px solid var(--line); padding:6px 10px;
    font-size:12px; color:var(--dim);}
  #btns{position:absolute; right:12px; bottom:12px; z-index:6; display:flex; gap:8px;}
  button{border:1px solid var(--line); background:rgba(29,32,38,.95); color:var(--ink);
    padding:9px 14px; font-size:12px; letter-spacing:1px; cursor:pointer;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  #toast{position:absolute; left:50%; bottom:64px; transform:translateX(-50%); z-index:7;
    background:rgba(20,22,26,.92); border:1px solid var(--line); padding:8px 16px;
    font-size:13px; pointer-events:none; opacity:0; transition:opacity .25s; max-width:92vw; text-align:center; white-space:nowrap;}
  #toast.show{opacity:1;}
  #touch{position:absolute; left:0; right:0; bottom:0; z-index:6; display:none;
    justify-content:space-between; padding:0 14px 86px; pointer-events:none;}
  #touch .cluster{display:flex; gap:10px; pointer-events:auto;}
  #touch button{width:62px; height:62px; font-size:22px;}
  @media (pointer:coarse){ #touch{display:flex;} #hint{display:none;} }
  #loading{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; gap:12px;
    align-items:center; justify-content:center; background:#14161a; font-size:13px; color:var(--dim);}
  .spin{width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--accent); animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* 子弹时间：上下黑边 + 四周暗角，出现即慢放， industrial 风格不加花字 */
  #bulletFx{position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0; transition:opacity .3s;
    background:
      linear-gradient(to bottom, rgba(20,26,34,.75) 0, rgba(20,26,34,.75) 7%, transparent 7.1%, transparent 92.9%, rgba(20,26,34,.75) 93%),
      radial-gradient(ellipse at center, transparent 52%, rgba(8,10,14,.6) 100%);}
  #bulletFx::after{content:''; position:absolute; inset:0;
    background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.06) 0 2deg, transparent 2deg 7deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent 42%, #000 43%);
    mask-image:radial-gradient(circle at 50% 50%, transparent 42%, #000 43%);}
  #app.bullet #bulletFx{opacity:1;}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div id="bulletFx"></div>
  <div id="hud">
    <div class="stat"><span id="score">0</span><label>SCORE</label></div>
    <div class="stat"><span id="left">0</span><label>BUILDINGS</label></div>
  </div>
  <div id="speedo"><b id="spd">0</b><label>KM/H</label></div>
  <div id="toast"></div>
  <div id="hint">WASD drive · Space brake · R reset · N rebuild</div>
  <div id="btns">
    <button id="btnReset">RESET</button>
    <button id="btnCity">REBUILD</button>
    <button id="btnSound">SOUND ON</button>
  </div>
  <div id="touch">
    <div class="cluster"><button data-k="a">&#9664;</button><button data-k="d">&#9654;</button></div>
    <div class="cluster"><button data-k="s">&#9660;</button><button data-k="w">&#9650;</button></div>
  </div>
  <div id="loading"><div class="spin"></div><div>LOADING…</div></div>
</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
const scoreEl=$('score'), leftEl=$('left'), spdEl=$('spd'), toastEl=$('toast');
let toastTimer=null;
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'), ms||2400);
}

let soundOn = true, AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function noiseBurst(dur=.2, vol=.3, cutoff=1200){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cutoff;
  const g=c.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function thump(v=1){ noiseBurst(.25,.25*v+.1,500); }
function crashBig(){ noiseBurst(.7,.5,2600); noiseBurst(.4,.35,400); }
function clank(){ if(!soundOn)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain(); o.type='square';
  o.frequency.setValueAtTime(320+Math.random()*200,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(70,c.currentTime+.18);
  g.gain.setValueAtTime(.12,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.22); }
// 发动机：持续嗡鸣，音高跟车速
let engOsc=null, engGain=null, engFilter=null;
function engineStart(){ const c=ac(); if(!c||engOsc) return;
  engOsc=c.createOscillator(); engGain=c.createGain(); engFilter=c.createBiquadFilter();
  engOsc.type='sawtooth'; engOsc.frequency.value=42; engFilter.type='lowpass'; engFilter.frequency.value=220;
  engGain.gain.value=0.0; engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(c.destination); engOsc.start(); }
function engineUpdate(speed, throttle){ if(!engOsc) return;
  const t=ac().currentTime;
  engOsc.frequency.setTargetAtTime(40+Math.abs(speed)*3.2+(throttle!==0?14:0), t, .1);
  engGain.gain.setTargetAtTime(soundOn?0.05+Math.min(.06,Math.abs(speed)*.002):0.0, t, .15); }

/* ================= 渲染器 / 场景（Toon 风格化） ================= */
const container=$('game');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.NoToneMapping;
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ec9e8);
scene.fog=new THREE.Fog(0x8ec9e8, 110, 260);

// Toon 阶梯光照：全局复用一张 4 阶 gradientMap
const _toonSteps=new Uint8Array([110,170,220,255]);
const _gradMap=new THREE.DataTexture(_toonSteps,4,1,THREE.RedFormat);
_gradMap.minFilter=THREE.NearestFilter; _gradMap.magFilter=THREE.NearestFilter;
_gradMap.needsUpdate=true;
function toon(hex,opts={}){ return new THREE.MeshToonMaterial(Object.assign({color:hex,gradientMap:_gradMap},opts)); }

const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 600);
// 45°俯视角：高度 ≈ 水平距离
const CAM_OFF=new THREE.Vector3(0,34,34);

const hemi=new THREE.HemisphereLight(0xcfe8ff,0xffd9a0,1.0); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0c0,2.2);
sun.position.set(40,70,20); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80;
sun.shadow.camera.far=220; sun.shadow.bias=-0.0006; sun.shadow.normalBias=.5;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,.35));

/* ================= 物理世界 ================= */
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-22,0)});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=.45;
world.defaultContactMaterial.restitution=.08;
const matGround=new CANNON.Material('ground'), matBox=new CANNON.Material('box');
const matDozer=new CANNON.Material('dozer');
const wallMat=new CANNON.Material('wall');
world.addContactMaterial(new CANNON.ContactMaterial(matGround,matBox,{friction:.5,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(matBox,matBox,{friction:.4,restitution:.12}));
// 推土机履带：低摩擦、零回弹，高压过碎块/地面时不被接触求解器拽住或弹开；
// 建筑碎块之间仍保持高摩擦堆叠，只有车体打滑阻力小
world.addContactMaterial(new CANNON.ContactMaterial(matGround,matDozer,{friction:.06,restitution:0}));
world.addContactMaterial(new CANNON.ContactMaterial(matBox,matDozer,{friction:.08,restitution:0}));
world.addContactMaterial(new CANNON.ContactMaterial(matDozer,matDozer,{friction:.08,restitution:0}));
world.addContactMaterial(new CANNON.ContactMaterial(wallMat,matDozer,{friction:.1,restitution:0}));

const ARENA=92; // 半径
(function ground(){
  const b=new CANNON.Body({mass:0,material:matGround,shape:new CANNON.Plane()});
  b.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(b);
  // 四周围墙（隐形）：复用上面的 wallMat，注意别再 const 重复声明
  const mk=(x,z,w,d)=>{ const wb=new CANNON.Body({mass:0,material:wallMat});
    wb.addShape(new CANNON.Box(new CANNON.Vec3(w/2,6,d/2))); wb.position.set(x,4,z); world.addBody(wb); };
  mk(0,-ARENA-2,ARENA*2+20,4); mk(0,ARENA+2,ARENA*2+20,4);
  mk(-ARENA-2,0,4,ARENA*2+20); mk(ARENA+2,0,4,ARENA*2+20);
})();

/* ---- 地面纹理：卡通沙盘风 ---- */
function groundTexture(){
  const c=document.createElement('canvas'); c.width=c.height=1024;
  const g=c.getContext('2d');
  g.fillStyle='#69b455'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(50,140,60,${.25+Math.random()*.3})`;
    const s=3+Math.random()*5; g.fillRect(Math.random()*1024,Math.random()*1024,s,s*.6); }
  for(let i=0;i<500;i++){ g.fillStyle='rgba(255,255,255,.28)';
    g.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  const road=(x,y,w,h)=>{ g.fillStyle='#4d5461'; g.fillRect(x,y,w,h);
    g.strokeStyle='#23262b'; g.lineWidth=6; g.strokeRect(x+3,y+3,w-6,h-6);
    g.strokeStyle='#f4f6f8'; g.lineWidth=3; g.setLineDash([30,24]);
    if(w>h){ g.beginPath(); g.moveTo(x+6,y+h/2); g.lineTo(x+w-6,y+h/2); g.stroke(); }
    else { g.beginPath(); g.moveTo(x+w/2,y+6); g.lineTo(x+w/2,y+h-6); g.stroke(); }
    g.setLineDash([]); };
  road(0,472,1024,80); road(472,0,80,1024);
  road(0,200,1024,44); road(200,0,44,1024); road(0,780,1024,44); road(780,0,44,1024);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4; return t;
}
{
  const gm=new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2+30,ARENA*2+30),
    new THREE.MeshToonMaterial({map:groundTexture(),gradientMap:_gradMap}));
  gm.rotation.x=-Math.PI/2; gm.receiveShadow=true; scene.add(gm);
}

/* ================= 注册表 ================= */
const destructibles=new Map(); // body.id -> {body, group, hp, maxHp, score, kind, size, color}
const debris=[];               // {mesh, body, life}
const fallings=[];             // 倒塌中的楼层块 {mesh, body, life}
const cars=[];
let score=0, kills=0, comboN=0, comboT=0, won=false;

function updateHUD(){
  scoreEl.textContent=score;
  let left=0; destructibles.forEach(d=>{ if(d.kind==='building') left++; });
  leftEl.textContent=left;
  if(left===0&&!won){ won=true; crashBig(); toast('CITY FLATTENED — press N to rebuild',4000); }
}
function addScore(n,x,z,label){
  score+=n; floatText('+'+n+(label||''),x,z);
  updateHUD();
}
// 飘字
const floaters=[];
function floatText(text,x,z){
  const c=document.createElement('canvas'); c.width=256; c.height=96;
  const g=c.getContext('2d'); g.font='bold 52px sans-serif'; g.textAlign='center';
  g.lineWidth=8; g.strokeStyle='rgba(0,0,0,.7)'; g.strokeText(text,128,62);
  g.fillStyle='#ffd54a'; g.fillText(text,128,62);
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false});
  const s=new THREE.Sprite(m); s.scale.set(7,2.6,1);
  s.position.set(x,9,z); scene.add(s);
  floaters.push({s,life:1.3});
}

/* ---- 尘土粒子池（Points） ---- */
const DUST_N=900;
const dustPos=new Float32Array(DUST_N*3), dustVel=new Float32Array(DUST_N*3), dustLife=new Float32Array(DUST_N);
dustPos.fill(-999);
const dustGeo=new THREE.BufferGeometry();
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
function dustTexture(){ const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='rgba(255,250,235,.95)';
  g.beginPath(); g.arc(32,32,26,0,Math.PI*2); g.fill(); // 卡通硬边圆
  g.fillStyle='rgba(255,250,235,.9)';
  g.beginPath(); g.arc(22,22,8,0,Math.PI*2); g.fill(); // 高光点
  return new THREE.CanvasTexture(c); }
const dustPts=new THREE.Points(dustGeo,new THREE.PointsMaterial({size:2.6,map:dustTexture(),
  transparent:true,opacity:.75,depthWrite:false}));
dustPts.frustumCulled=false; scene.add(dustPts);
let dustCursor=0;
function puff(x,y,z,n=14,spread=5,up=7){
  for(let i=0;i<n;i++){ const k=dustCursor=(dustCursor+1)%DUST_N;
    dustPos[k*3]=x+(Math.random()-.5)*2; dustPos[k*3+1]=y+Math.random(); dustPos[k*3+2]=z+(Math.random()-.5)*2;
    dustVel[k*3]=(Math.random()-.5)*spread; dustVel[k*3+1]=Math.random()*up; dustVel[k*3+2]=(Math.random()-.5)*spread;
    dustLife[k]=.8+Math.random()*.9; }
}
function updateDust(dt){
  for(let k=0;k<DUST_N;k++){ if(dustLife[k]<=0) continue;
    dustLife[k]-=dt; dustVel[k*3+1]-=2*dt;
    dustPos[k*3]+=dustVel[k*3]*dt; dustPos[k*3+1]+=dustVel[k*3+1]*dt; dustPos[k*3+2]+=dustVel[k*3+2]*dt;
    if(dustLife[k]<=0||dustPos[k*3+1]<0) { dustLife[k]=0; dustPos[k*3+1]=-999; } }
  dustGeo.attributes.position.needsUpdate=true;
}

/* ================= 建材（Toon 风格化） ================= */
const _texCache=new Map();
function canvasTex(key,draw,w=256,h=256){
  if(_texCache.has(key)) return _texCache.get(key);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  _texCache.set(key,t); return t;
}
function brickTexture(base='#e0705a'){ return canvasTex('brick:'+base,(g,w,h)=>{
  g.fillStyle=base; g.fillRect(0,0,w,h);
  const bh=h/8, bw=w/4;
  for(let r=0;r<8;r++){ const off=(r%2)*bw/2;
    for(let cx=-1;cx<5;cx++){ const x=cx*bw+off, y=r*bh;
      const l=Math.random()*14-7;
      g.fillStyle=`rgba(${l>0?255:0},${l>0?255:0},${l>0?255:0},${Math.abs(l)/100})`;
      g.fillRect(x+2,y+2,bw-4,bh-4); }
    g.fillStyle='rgba(60,20,15,.55)'; g.fillRect(0,r*bh,w,3); }
  g.fillStyle='rgba(60,20,15,.4)';
  for(let cx=0;cx<5;cx++) g.fillRect(cx*bw,0,2,h);
});}
function concreteTexture(base='#cfd6e2'){ return canvasTex('concrete:'+base,(g,w,h)=>{
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(90,100,120,${Math.random()*.16})`;
    g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  g.fillStyle='rgba(90,100,120,.25)';
  for(let i=0;i<4;i++) g.fillRect(0,Math.random()*h,w,3);
});}
function hazardTexture(){ return canvasTex('hazard',(g,w,h)=>{
  g.fillStyle='#ffc21c'; g.fillRect(0,0,w,h);
  g.fillStyle='#23262b';
  for(let i=-2;i<8;i++){ g.save(); g.translate(i*40,0); g.rotate(Math.PI/4);
    g.fillRect(0,-h,20,h*3); g.restore(); }
  g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(0,0,w,10);
});}
function windowsTexture(lit=.45,base='#33465e'){ return canvasTex('win:'+lit+base,(g,w,h)=>{
  g.fillStyle=base; g.fillRect(0,0,w,h);
  const cols=4, rows=6, cw=w/cols, ch=h/rows;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const on=Math.random()<lit;
    g.fillStyle=on?'#ffe9a3':'#1d2b3d';
    g.fillRect(c*cw+4,r*ch+5,cw-8,ch-10);
    g.fillStyle=on?'rgba(255,255,255,.55)':'rgba(255,255,255,.14)';
    g.fillRect(c*cw+4,r*ch+5,cw-8,5);
  }
  g.strokeStyle='rgba(20,26,34,.9)'; g.lineWidth=3;
  for(let c=0;c<=cols;c++){ g.beginPath(); g.moveTo(c*cw,0); g.lineTo(c*cw,h); g.stroke(); }
  for(let r=0;r<=rows;r++){ g.beginPath(); g.moveTo(0,r*ch); g.lineTo(w,r*ch); g.stroke(); }
});}
// 反向外壳描边：给 mesh 加一个 BackSide 放大副本；thin 档给薄板用防 z-fighting
const _outlineMat=new THREE.MeshBasicMaterial({color:0x23262b,side:THREE.BackSide});
function addOutline(mesh,ratio=.035,min=.05){
  const s=new THREE.Mesh(mesh.geometry,_outlineMat);
  const d=new THREE.Vector3(); mesh.geometry.computeBoundingBox();
  mesh.geometry.boundingBox.getSize(d);
  const t=Math.max(min,d.length()*ratio);
  s.scale.setScalar(1+t/Math.max(.001,Math.max(d.x,d.y,d.z)));
  s.raycast=()=>{}; mesh.add(s); return s;
}
const M={
  wall:new THREE.MeshToonMaterial({color:0xf3e5cf,gradientMap:_gradMap}),
  brick:new THREE.MeshToonMaterial({color:0xffffff,gradientMap:_gradMap,map:brickTexture('#e0705a')}),
  concrete:new THREE.MeshToonMaterial({color:0xffffff,gradientMap:_gradMap,map:concreteTexture()}),
  glass:new THREE.MeshToonMaterial({color:0x7fd4f2,gradientMap:_gradMap}),
  roof:new THREE.MeshToonMaterial({color:0x4a5568,gradientMap:_gradMap}),
  wood:new THREE.MeshToonMaterial({color:0xc98f4e,gradientMap:_gradMap}),
  yellow:new THREE.MeshToonMaterial({color:0xffc21c,gradientMap:_gradMap}),
  darkMetal:new THREE.MeshToonMaterial({color:0x333943,gradientMap:_gradMap}),
  track:new THREE.MeshToonMaterial({color:0x23262b,gradientMap:_gradMap}),
  cabinGlass:new THREE.MeshToonMaterial({color:0x9fe4ff,gradientMap:_gradMap}),
  trunk:new THREE.MeshToonMaterial({color:0x8a5a33,gradientMap:_gradMap}),
  leaf:new THREE.MeshToonMaterial({color:0x58b34a,gradientMap:_gradMap}),
  leaf2:new THREE.MeshToonMaterial({color:0x3f9440,gradientMap:_gradMap}),
  tire:new THREE.MeshToonMaterial({color:0x1e2126,gradientMap:_gradMap}),
};
function box(w,h,d,mat,x=0,y=0,z=0,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; return m;
}
function addStaticBox(group,cx,cy,cz,w,h,d){
  const body=new CANNON.Body({mass:0,material:matBox});
  body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));
  body.position.set(cx,cy,cz); body.allowSleep=true; body.sleep();
  world.addBody(body); return body;
}

/* ---- Toon风楼房：贴图墙面 + 女儿墙 + 屋顶水箱 + 空调机 ---- */
function makeBuilding(cx,cz,w,h,d,style){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const pal = style==='brick'
    ? {wall:0xffffff,win:.4,base:'#e0705a'}
    : style==='glass'
    ? {wall:0x8fd8f5,win:.62,base:null}
    : {wall:0xffffff,win:.45,base:'#cfd6e2'};
  const wallMat = style==='brick' ? new THREE.MeshToonMaterial({color:0xffffff,gradientMap:_gradMap,map:brickTexture(pal.base)})
    : style==='concrete' ? new THREE.MeshToonMaterial({color:0xffffff,gradientMap:_gradMap,map:concreteTexture('#cfd6e2')})
    : style==='glass' ? new THREE.MeshToonMaterial({color:pal.wall,gradientMap:_gradMap})
    : M.wall;
  const base=box(w,h,d,wallMat,0,h/2,0); base.name='base'; g.add(base);
  // 窗户：整面贴图代替逐窗mesh，大楼 DrawCall 从上百降到个位数
  const winMat=new THREE.MeshToonMaterial({gradientMap:_gradMap,map:windowsTexture(pal.win)});
  const winF=new THREE.Mesh(new THREE.PlaneGeometry(w*.96,h*.86),winMat);
  winF.position.set(0,h*.5,d/2+.03); g.add(winF);
  const winB=winF.clone(); winB.rotation.y=Math.PI; winB.position.set(0,h*.5,-d/2-.03); g.add(winB);
  const winL=new THREE.Mesh(new THREE.PlaneGeometry(d*.96,h*.86),winMat);
  winL.rotation.y=-Math.PI/2; winL.position.set(-w/2-.03,h*.5,0); g.add(winL);
  const winR=winL.clone(); winR.rotation.y=Math.PI/2; winR.position.set(w/2+.03,h*.5,0); g.add(winR);
  // 底部大门 + 雨棚 + 门柱
  g.add(box(Math.min(3.4,w*.5),2.3,.3,M.darkMetal,0,1.15,d/2+.1));
  const awn=box(Math.min(4.4,w*.6),.25,1.4,new THREE.MeshToonMaterial({color:0xff5a5a,gradientMap:_gradMap}),0,2.6,d/2+.7); g.add(awn);
  g.add(box(.25,2.5,.25,M.darkMetal,-Math.min(2,w*.28),1.25,d/2+1.2));
  g.add(box(.25,2.5,.25,M.darkMetal,Math.min(2,w*.28),1.25,d/2+1.2));
  // 女儿墙描边 + 屋顶水箱（描边）+ 空调外机
  const parapet=box(w+.4,.9,d+.4,M.roof,0,h+.4,0); addOutline(parapet,.02,.06); g.add(parapet);
  g.add(box(w*.92,.25,d*.92,M.concrete,0,h+.02,0));
  const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,1.9,12),M.wood);
  tank.position.set(-w/4,h+1.6,d/5); tank.castShadow=true; addOutline(tank); g.add(tank);
  const tankTop=new THREE.Mesh(new THREE.ConeGeometry(1.2,.8,12),M.roof);
  tankTop.position.set(-w/4,h+2.9,d/5); tankTop.castShadow=true; g.add(tankTop);
  for(let li=0;li<3;li++) g.add(box(.12,1.6,.12,M.darkMetal,-w/4+1.25,h+1.3,d/5-.4+li*.4));
  for(let ai=0;ai<2;ai++){ const ax=w/4+(ai-.5)*2.4;
    g.add(box(1.1,.8,.6,M.concrete,ax,h+.9,-d/5));
    g.add(box(.9,.12,.06,M.darkMetal,ax,h+.9,-d/5+.32)); }
  scene.add(g);
  const body=addStaticBox(g,cx,h/2,cz,w,h,d);
  const hp=Math.round(2+h/5);
  destructibles.set(body.id,{body,group:g,hp,maxHp:hp,score:120+Math.round(w*h*d/22),kind:'building',
    size:{w,h,d},color:new THREE.Color(style==='brick'?0xe0705a:style==='glass'?0x8fd8f5:0xcfd6e2),state:'stand',fallTimer:0});
  return body;
}
function makeWallRun(x1,z1,x2,z2){
  const len=Math.hypot(x2-x1,z2-z1), n=Math.max(1,Math.round(len/4));
  for(let i=0;i<n;i++){ const t=(i+.5)/n, cx=x1+(x2-x1)*t, cz=z1+(z2-z1)*t;
    const g=new THREE.Group(); g.position.set(cx,0,cz);
    g.rotation.y=Math.atan2(x2-x1,z2-z1)+Math.PI/2;
    const wb=box(4,2.2,.6,M.brick,0,1.1,0); addOutline(wb,.015,.04); g.add(wb);
    const cap=box(4.4,.35,.9,M.concrete,0,2.35,0); addOutline(cap,.015,.04); g.add(cap);
    g.add(box(.5,2.6,.8,M.concrete,0,1.3,0)); // 卡通砖柱
    scene.add(g);
    const body=addStaticBox(g,cx,1.1,cz,4,2.2,.6);
    destructibles.set(body.id,{body,group:g,hp:1,maxHp:1,score:40,kind:'wall',size:{w:4,h:2.2,d:.6},color:new THREE.Color(0xe0705a),state:'stand',fallTimer:0});
  }
}

function makeTree(cx,cz){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.32,.5,3,7),M.trunk);
  trunk.position.y=1.5; trunk.castShadow=true; g.add(trunk);
  const flare=new THREE.Mesh(new THREE.CylinderGeometry(.62,.8,.6,7),M.trunk);
  flare.position.y=.3; flare.castShadow=true; g.add(flare);
  // 卡通树冠：3 个低多边形 blob，flatShading + 高低明度 + 描边
  const blobs=[[0,4.4,0,2.5,M.leaf],[1.4,3.8,.6,1.6,M.leaf2],[-1.3,3.9,-.5,1.7,M.leaf2],[.2,5.6,-.2,1.5,M.leaf]];
  for(const [bx,by,bz,br,bm] of blobs){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(br,0),bm.clone());
    m.material.flatShading=true; m.position.set(bx,by,bz);
    m.rotation.set(Math.random()*3,Math.random()*3,0);
    m.castShadow=true; addOutline(m,.03,.07); g.add(m);

  scene.add(g);
  const body=addStaticBox(g,cx,2,cz,1,4,1);
  destructibles.set(body.id,{body,group:g,hp:1,maxHp:1,score:20,kind:'tree',size:{w:1.5,h:5,d:1.5},color:new THREE.Color(0x58b34a),state:'stand'});
}

const dozer={ speed:0, group:new THREE.Group(), wheels:[], bladeMesh:null, body:null, exhaustTip:new THREE.Object3D() };

  const cabB=box(2.0,1.5,2.0,M.yellow,0,2.7,-.8); addOutline(cabB,.02,.05); g.add(cabB);
  const glassM=M.cabinGlass;
  g.add(box(1.7,.95,.14,glassM,0,2.9,.22));
  g.add(box(.14,.95,1.7,glassM,-1.0,2.9,-.8)); g.add(box(.14,.95,1.7,glassM,1.0,2.9,-.8));
  g.add(box(2.1,.16,2.1,M.darkMetal,0,3.55,-.8)); // 顶盖
  for(const px of [-.7,0,.7]) g.add(box(.16,1.5,.16,M.darkMetal,px,2.7,.22)); // 前立柱
  const ex=new THREE.Mesh(new THREE.CylinderGeometry(.14,.17,1.5,10),M.darkMetal);

  exTip.position.set(.85,3.68,.9); g.add(exTip);

  const lampM=new THREE.MeshBasicMaterial({color:0xfff3c0});
  const lL=box(.36,.3,.16,lampM,-.7,2.2,2.82,false), lR=box(.36,.3,.16,lampM,.7,2.2,2.82,false);

function buildDozerBody(x=0,z=30){
  // 车重 110：碎块（1~10）撞上来基本没感觉，只有“顿”没有“飞”
  const body=new CANNON.Body({mass:110,material:matDozer});
  body.addShape(new CANNON.Box(new CANNON.Vec3(1.9,1.1,2.9)),new CANNON.Vec3(0,1.2,0));
  body.addShape(new CANNON.Box(new CANNON.Vec3(2.7,.75,.3)),new CANNON.Vec3(0,1.0,4.0));
  body.position.set(x,2.2,z);
  // 出生就面朝 -Z（车尾对着跟随相机），和 resetDozer 一致；
  // 否则第一条命车头朝着相机，按 A 会往屏幕右边跑，像“反着开”
  body.quaternion.setFromEuler(0,Math.PI,0);
  // 角阻尼不能太大：cannon 会按 (1-damping)^dt 吃掉我们每帧给的转向角速度，
  // 之前 0.88 直接把转弯掐死了。Y 轴转向靠代码控，只用小阻尼防抖；
  // X/Z 翻滚在 step 里手动压住。
  body.angularDamping=.15; body.linearDamping=.08; body.allowSleep=false;
  world.addBody(body); dozer.body=body;
  body.addEventListener('collide',onDozerCollide);
}
// 撞击在 step 后从 world.contacts 快照读取：cannon-es 的 collide 回调里读
// getImpactVelocityAlongNormal 会因方程复用抛错，这是之前报错的真正病根。
const pendingHits=[];
function onDozerCollide(e){ /* 仅保留监听以唤醒，无读取 */ }
// 碎块 / 倒塌块 body.id 集合：撞到它们只给轻音效，绝不震屏、绝不减速
const fragIds=new Set();
function drainCollideEvents(){
  const b=dozer.body;
  const contacts=b.world ? b.world.contacts : [];
  for(const c of contacts){
    const o=(c.bi===b)?c.bj:c.bi;
    if(!o || o.id===undefined) continue;
    if(c.bi!==b && c.bj!==b) continue;
    let v=0; try{ v=Math.abs(c.getImpactVelocityAlongNormal()||0); }catch(_){ continue; }
    if(!isFinite(v)||v<=0) continue;
    // 碎块 / 倒塌块：只记轻蹭音效，绝不震屏、绝不减速
    if(fragIds.has(o.id)){ if(v>7) pendingHits.push({frag:true,v}); continue; }
    const d=destructibles.get(o.id);
    const spd=Math.abs(dozer.speed);
    if(d){ if(v>2.2||spd>5) pendingHits.push({d,v,spd}); }
    else if(v>6) pendingHits.push({d:null,v,spd});
  }
}
function processHits(){
  for(let i=0;i<pendingHits.length;i++){
    const h=pendingHits[i];
    // 碎块 / 倒塌块蹭车：只给一声轻响，绝不震屏、绝不减速
    if(h.frag){ if(h.v>7) thump(.25); continue; }
    const {d,v,spd}=h;
    if(d){
      if(d.hp<=0 || !destructibles.has(d.body.id)) continue;
      const hard=spd>11||v>8;
      const nowHit=performance.now();
      damageDestructible(d, hard?2:1, v, true);
      if(v>3){ thump(Math.min(1,v/12)); }
      // 震屏：每个可撞物只在第一次被撞到时抖一下；碎块剐蹭、重复顶撞、撞墙都不抖
      // 子弹时间：只有楼房首撞才触发，碎块/小物件/重复顶撞不触发
      // 星爆：楼房每次被撞都有（350ms 节流防刷屏），不只首撞；撞碎不在此分支（已删出注册表）
      if(!d._shook){ d._shook=true; shakeCam(d.kind==='building'?1.2:d.kind==='car'?.8:.5);
        if(d.kind==='building') triggerBullet(); }
      if(d.kind==='building'){
        if(!d._burstT || nowHit-d._burstT>350){
          d._burstT=nowHit;
          const bp=d.body.position;
          if(destructibles.has(d.body.id)) burst(bp.x,Math.max(3,d.size.h*.6),bp.z,1.1);
        }
      }
      // 撞上东西：同一个目标 0.5s 内只罚一次速（按撞击强度 8%~18%），
      // 之前贴着建筑每帧连乘 .55，速度几帧就归零，这就是短暂停顿的来源
      const now=performance.now();
      if(!d.wrecked && (!d._lastSlow || now-d._lastSlow>500)){
        d._lastSlow=now;
        dozer.speed*=1-Math.min(.18,Math.max(.08,v*.012));
        step._hitCd=.12;
      }
    } else {
      // 撞墙/地面：震屏同样只给“首撞一下”，之后 1s 内顶墙剐蹭不再抖；
      // 碎块走 fragIds 分支，只给轻响，天然不抖
      const now2=performance.now();
      if(!step._lastWallShake || now2-step._lastWallShake>1000){
        step._lastWallShake=now2;
        thump(.5); shakeCam(.4); puff(dozer.body.position.x,1,dozer.body.position.z,8,6,5);
      }
      // 撞墙/地面：同上，0.5s 内只罚一次
      if(!step._lastWallSlow || now2-step._lastWallSlow>500){

function damageDestructible(d,dmg,impactV=5,byDozer=false){
  if(d.hp<=0 || d.state==='falling' || d.falling) return;
  // 小物件（树/灯/箱/墙）：血量打空直接压扁，不走楼房倒塌流程
  if(d.kind==='tree'||d.kind==='lamp'||d.kind==='crate'||d.kind==='wall'){
    d.hp-=dmg;
    const p=d.body.position;
    puff(p.x,Math.max(1.5,d.size.h*.6),p.z,6,4,5);
    if(d.hp>0){
      d.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ o.material=o.material.clone();
        o.material.emissive=new THREE.Color(0xaa6611); o.material.emissiveIntensity=.6;
        setTimeout(()=>{o.material.emissiveIntensity=0;},120); } });
      return;
    }
    squashSmall(d);
    return;
  }
  d.hp-=dmg;
  const p=d.body.position;
  puff(p.x,Math.max(1.5,d.size.h*.6),p.z,6,4,5);
  // 阶段一：墙体碎裂——掉渣 + 裂纹变暗
  if(d.hp>0){
    spawnDebrisChunk(p.x,p.y||3,p.z,d.color,Math.min(d.size.w,d.size.d)*.4);
    d.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ o.material=o.material.clone();
      o.material.emissive=new THREE.Color(0xff5522); o.material.emissiveIntensity=.55;
      setTimeout(()=>{o.material.emissiveIntensity=.15;},160); } });
    // 越残越晃：整体倾斜一点，预告倒塌
    const dmgRatio=1-d.hp/d.maxHp;
    d.group.rotation.z=(Math.random()-.5)*.05*dmgRatio;
    return;
  }
  // 阶段二+三：整体倒塌成可推动的楼块，再碎成块（见 toppleBuilding）
  toppleBuilding(d,impactV);
}

// 楼房倒塌：整栋变成动态刚体向前扑倒，落地后碎裂成块，块再慢慢消失
function toppleBuilding(d,impactV=8){
  const p=d.body.position.clone(), s=d.size;
  destructibles.delete(d.body.id);
  world.removeBody(d.body); scene.remove(d.group);
  kills++;
  if(comboT>0) comboN++; else comboN=1;
  comboT=1.4;
  addScore(d.score+(comboN>=2?comboN*30:0),p.x,p.z,comboN>=2?(' x'+comboN):'');
  if(comboN===3) crashBig();
  // 倒塌块：按楼层切 2~4 段，每段都是可碰撞刚体，向撞击方向倾倒
  const segs=Math.min(4,Math.max(2,Math.round(s.h/5)));
  const segH=s.h/segs;
  const dir=new THREE.Vector3(dozer.body.position.x-p.x,0,dozer.body.position.z-p.z).normalize();
  if(dir.lengthSq()<.01) dir.set(0,0,1);
  for(let i=0;i<segs;i++){
    const cy=p.y-s.h/2+segH*(i+.5);
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(s.w,segH,s.d),fragMat(d.color.clone().offsetHSL(0,0,(Math.random()-.5)*.08)));
    mesh.castShadow=true; mesh.receiveShadow=true;

    // 靠重力自然压塌而不是高速糊脸砸车。之前顶层 4 倍加速 + 20+ 初速
    // 直接把 70kg 的车当球踢飞，这是撞楼被弹飞的真凶
    const push=Math.min(4,1.5+impactV*.12);

function step(dt){
  // -- 驾驶：全部用指数阻尼平滑，与帧率无关 --
  const {throttle,steer,brake}=readInput();
  const b=dozer.body;
  const MAXS=46;
  const target=brake?0:throttle*MAXS;
  const accel=brake?150:(Math.abs(target)>Math.abs(dozer.speed)?85:110);
  // 速度混合：系数要够强才能顶开碎块，否则撞上东西就顶死不动；
  // 起步推力给足，撞墙仍会经接触求解器减速，保留顿挫感
  // 撞击缓冲：刚撞上东西的 0.12s 内用中等强度跟速度（dt*12），
  // 让接触求解器先结算、又不至于完全松开导致车头栽进去；平时 dt*30 顶开碎块
  step._hitCd=Math.max(0,(step._hitCd||0)-dt);
  const k=step._hitCd>0?Math.min(1,dt*12):Math.min(1,dt*30);
  const want=dozer.speed+Math.sign(target-dozer.speed)*Math.min(Math.abs(target-dozer.speed),accel*dt);
  dozer.speed=want;
  if(throttle===0&&!brake) dozer.speed*=Math.max(0,1-0.25*dt);
  const spdAbs=Math.abs(dozer.speed);
  const wantFov=50+Math.min(14,spdAbs*.35);
  if(Math.abs(camera.fov-wantFov)>.02){ camera.fov+=(wantFov-camera.fov)*Math.min(1,dt*3); camera.updateProjectionMatrix(); }
  // 前方向（物理四元数）
  q.copy(b.quaternion);
  fwd.set(0,0,1).applyQuaternion(q); fwd.y=0;
  if(fwd.lengthSq()<.01) fwd.set(0,0,1); fwd.normalize();
  // 速度混合而不是硬赋值：保留物理求解器给的纵向速度，撞墙减速真实且不跳变
  const vx=fwd.x*dozer.speed, vz=fwd.z*dozer.speed;
  b.velocity.x+=(vx-b.velocity.x)*k; b.velocity.z+=(vz-b.velocity.z)*k;
  if(Math.abs(b.velocity.y)>30) b.velocity.y=Math.sign(b.velocity.y)*30;
  // 转向：双重平滑（输入阻尼 + 角速度阻尼），低速灵、高速稳；
  // 用角速度转向，让 cannon 内部积分保持连续
  steerSm+=(steer-steerSm)*Math.min(1,dt*6);
  const dirSign=dozer.speed<-1?-1:1;
  // 原地（松油门）也允许慢速转向：推土机就该能原地掉头；
  // 高速时收敛，保证撞楼时车头可控
  const grip=Math.min(1,.45+spdAbs/18);
  const yawRate=steerSm*(1.1+Math.min(1.2,spdAbs*.03))*dirSign*(brake?0:grip);
  // X/Z 翻滚分量手动压住（替代原来的高 angularDamping），Y 轴转向保留
  b.angularVelocity.x*=.5; b.angularVelocity.z*=.5;
  b.angularVelocity.y+=(yawRate-b.angularVelocity.y)*Math.min(1,dt*8);
  // 直接转车身四元数（绕世界 Y 轴）：转向不再经过 cannon 角速度积分，
  // 不会被 linearDamping/angularDamping 或接触方程吃掉，按多久转多久
  _yawQ.setFromAxisAngle(_YAXIS,yawRate*dt);
  _yawQ.mult(b.quaternion,b.quaternion);
  // 防翻：把上向量拉回 +Y
  _up.set(0,1,0); b.quaternion.vmult(_up,_up);
  if(_up.y<.55){
    b.applyTorque(new CANNON.Vec3(_up.z*2200,0,-_up.x*2200));
    if(!step._tipped){ step._tipped=true; toast('Flipped — press R to reset',2500); setTimeout(()=>step._tipped=false,3000); }
  }
  b.wakeUp();

  // -- 物理 --
  world.step(1/60,dt,3);
  drainCollideEvents(); processHits();
  // 碎块限速 + 超时清理
  for(let i=debris.length-1;i>=0;i--){ const o=debris[i]; o.life-=dt;
    const v=o.body.velocity, sp=v.length();
    if(sp>MAX_DEBRIS_VEL) v.scale(MAX_DEBRIS_VEL/sp,v);
    if(o.life<=0){ scene.remove(o.mesh); world.removeBody(o.body); fragIds.delete(o.body.id); debris.splice(i,1);
      o.mesh.geometry.dispose(); continue; }
    if(o.life<1.2){ const s=Math.max(.01,o.life/1.2); o.mesh.scale.setScalar(s); }
  }
  // 倒塌块：落地（高度低 + 速度慢）或超时 → 碎成小块
  for(let i=fallings.length-1;i>=0;i--){ const f=fallings[i]; f.life-=dt;
    if(f.flat){ if(f.life<=0){ scene.remove(f.mesh); if(f.rim) scene.remove(f.rim); fallings.splice(i,1); } continue; }
    const sp=f.body.velocity.length();
    const low=f.body.position.y<3&&sp<4;
    if(low||f.life<=0){ shatterFalling(f,sp); continue; }
    if(f.life<1.5){ const s=Math.max(.3,f.life/1.5); f.mesh.scale.setScalar(s); }
  }
  comboT=Math.max(0,comboT-dt); if(comboT===0&&comboN!==0){comboN=0;}

  // -- 同步网格（用插值后的位置/朝向，消除物理步长与渲染帧不同步的抖动） --
  dozer.group.position.copy(renderPos(b)); dozer.group.quaternion.copy(renderQuat(b));
  destructibles.forEach(d=>{ if(d.kind==='car'){ d.group.position.copy(renderPos(d.body)); d.group.quaternion.copy(renderQuat(d.body));
    const sp2=d.body.velocity.length();
    if(sp2>9&&!d._hit){ d._hit=true; setTimeout(()=>d._hit=false,600);
      if(sp2>13){ d.hp-=1; puff(d.body.position.x,2,d.body.position.z,10,6,7); clank();
        if(!d._shook){ d._shook=true; shakeCam(.4); }
        if(d.hp<=0&&!d.wrecked){ d.wrecked=true; demolish(d,sp2); } } }
  }});
  debris.forEach(o=>{ o.mesh.position.copy(renderPos(o.body)); o.mesh.quaternion.copy(renderQuat(o.body)); });
  fallings.forEach(f=>{ if(f.body){ f.mesh.position.copy(renderPos(f.body)); f.mesh.quaternion.copy(renderQuat(f.body)); } });
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt;
    f.s.position.y+=dt*3; f.s.material.opacity=Math.min(1,f.life);
    if(f.life<=0){ if(f.s.isSprite&&f.s.material.map===starTexture()){ f.s.visible=false; f.s.removeFromParent(); burstPool.push(f.s); }
      else scene.remove(f.s);
      floaters.splice(i,1); } }

  const spd=Math.abs(dozer.speed);
  spdEl.textContent=Math.round(spd*3.6);
  engineUpdate(dozer.speed,throttle);
  const roll=dozer.speed*.55;
  dozer.wheels.forEach(w=>{ w.rotation.x+=roll*dt; });
  exhaustT-=dt;
  if((throttle!==0||spd>6)&&exhaustT<=0){ exhaustT=.09;
    dozer.exhaustTip.getWorldPosition(tipTmp);
    puff(tipTmp.x,tipTmp.y,tipTmp.z,1,1,2.5); }
  if(spd>10&&Math.random()<.5){ puff(b.position.x-fwd.x*2,.6,b.position.z-fwd.z*2,2,5,4); }

  // -- 45°俯视跟随相机 + 震屏：目标点和位置都做阻尼，避免相机抽搐 --
  camTmp.set(b.position.x,0,b.position.z).addScaledVector(fwd,4);
  camTarget.lerp(camTmp,1-Math.pow(.0001,dt));
  camShake=Math.max(0,camShake-dt*8);
  if(camShake>0){ camSh.set((Math.random()-.5)*camShake*.5,(Math.random()-.5)*camShake*.2,(Math.random()-.5)*camShake*.5); }
  else camSh.set(0,0,0);
  camera.position.copy(camTarget).add(CAM_OFF).add(camSh);
  camera.lookAt(camTarget.x+camSh.x,0,camTarget.z+camSh.z);
  sun.position.set(camTarget.x+40,70,camTarget.z+20);
  sun.target.position.set(camTarget.x,0,camTarget.z); sun.target.updateMatrixWorld();
}

function frame(){
  // 物理错误只记控制台，不再弹条打扰玩家
  requestAnimationFrame(frame);
  const rawDt=Math.min(.05,clock.getDelta());
  // 子弹时间：慢进快出，持续 bulletT 秒（真实时间），其余时间 timeScale 回到 1
  if(bulletT>0) bulletT-=rawDt;
  const target=bulletT>0?0.25:1;
  timeScale+=(target-timeScale)*Math.min(1,rawDt*(bulletT>0?6:3));
  if(bulletT<=0&&timeScale>0.99){ timeScale=1; document.getElementById('app').classList.remove('bullet'); }
  const dt=rawDt*timeScale;
  try{ step(dt); }catch(err){ console.error('[physics]',err); }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
document.addEventListener('pointerdown',()=>{ac();engineStart();},{once:true});
frame();
</script>
</body>
</html>
