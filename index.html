<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>推土机拆迁现场</title>
<style>
  :root{ --bg:#14161a; --panel:#1d2026; --ink:#f2f2f0; --dim:#a8adb5; --accent:#ffb400; --line:#33373f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;}
  #app{position:fixed; inset:0;}
  #game{position:absolute; inset:0;}
  canvas{display:block;}
  #hud{position:absolute; top:12px; left:12px; z-index:5; display:flex; gap:8px; pointer-events:none;}
  .stat{background:rgba(29,32,38,.9); border:1px solid var(--line); border-left:4px solid var(--accent);
    padding:6px 12px; min-width:88px;}
  .stat span{display:block; font-size:20px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
  .stat label{font-size:10px; letter-spacing:1.5px; color:var(--dim);}
  #speedo{position:absolute; top:12px; right:12px; z-index:5; pointer-events:none; text-align:right;
    background:rgba(29,32,38,.9); border:1px solid var(--line); padding:6px 12px;}
  #speedo b{font-size:20px; font-variant-numeric:tabular-nums;}
  #speedo label{font-size:10px; letter-spacing:1.5px; color:var(--dim); margin-left:4px;}
  #hint{position:absolute; left:12px; bottom:12px; z-index:5; pointer-events:none;
    background:rgba(20,22,26,.85); border:1px solid var(--line); padding:6px 10px;
    font-size:12px; color:var(--dim);}
  #btns{position:absolute; right:12px; bottom:12px; z-index:6; display:flex; gap:8px;}
  button{border:1px solid var(--line); background:rgba(29,32,38,.95); color:var(--ink);
    padding:9px 14px; font-size:12px; letter-spacing:1px; cursor:pointer;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  #toast{position:absolute; left:50%; bottom:64px; transform:translateX(-50%); z-index:7;
    background:rgba(20,22,26,.92); border:1px solid var(--line); padding:8px 16px;
    font-size:13px; pointer-events:none; opacity:0; transition:opacity .25s; max-width:92vw; text-align:center; white-space:nowrap;}
  #toast.show{opacity:1;}
  #touch{position:absolute; left:0; right:0; bottom:0; z-index:6; display:none;
    justify-content:space-between; padding:0 14px 86px; pointer-events:none;}
  #touch .cluster{display:flex; gap:10px; pointer-events:auto;}
  #touch button{width:62px; height:62px; font-size:22px;}
  @media (pointer:coarse){ #touch{display:flex;} #hint{display:none;} }
  #loading{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; gap:12px;
    align-items:center; justify-content:center; background:#14161a; font-size:13px; color:var(--dim);}
  .spin{width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--accent); animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div id="hud">
    <div class="stat"><span id="score">0</span><label>SCORE</label></div>
    <div class="stat"><span id="left">0</span><label>BUILDINGS</label></div>
  </div>
  <div id="speedo"><b id="spd">0</b><label>KM/H</label></div>
  <div id="toast"></div>
  <div id="hint">WASD 开车 · Space 刹车 · R 扶正 · N 重建</div>
  <div id="btns">
    <button id="btnReset">扶正</button>
    <button id="btnCity">重建</button>
    <button id="btnSound">声音开</button>
  </div>
  <div id="touch">
    <div class="cluster"><button data-k="a">&#9664;</button><button data-k="d">&#9654;</button></div>
    <div class="cluster"><button data-k="s">&#9660;</button><button data-k="w">&#9650;</button></div>
  </div>
  <div id="loading"><div class="spin"></div><div>正在加载…</div></div>
</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
const scoreEl=$('score'), leftEl=$('left'), spdEl=$('spd'), toastEl=$('toast');
let toastTimer=null;
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'), ms||2400);
}

let soundOn = true, AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function noiseBurst(dur=.2, vol=.3, cutoff=1200){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cutoff;
  const g=c.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function thump(v=1){ noiseBurst(.25,.25*v+.1,500); }
function crashBig(){ noiseBurst(.7,.5,2600); noiseBurst(.4,.35,400); }
function clank(){ if(!soundOn)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain(); o.type='square';
  o.frequency.setValueAtTime(320+Math.random()*200,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(70,c.currentTime+.18);
  g.gain.setValueAtTime(.12,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.22); }
// 发动机：持续嗡鸣，音高跟车速
let engOsc=null, engGain=null, engFilter=null;
function engineStart(){ const c=ac(); if(!c||engOsc) return;
  engOsc=c.createOscillator(); engGain=c.createGain(); engFilter=c.createBiquadFilter();
  engOsc.type='sawtooth'; engOsc.frequency.value=42; engFilter.type='lowpass'; engFilter.frequency.value=220;
  engGain.gain.value=0.0; engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(c.destination); engOsc.start(); }
function engineUpdate(speed, throttle){ if(!engOsc) return;
  const t=ac().currentTime;
  engOsc.frequency.setTargetAtTime(40+Math.abs(speed)*3.2+(throttle!==0?14:0), t, .1);
  engGain.gain.setTargetAtTime(soundOn?0.05+Math.min(.06,Math.abs(speed)*.002):0.0, t, .15); }

/* ================= 渲染器 / 场景 ================= */
const container=$('game');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14161a);
scene.fog=new THREE.Fog(0x14161a, 90, 230);

const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 600);
// 45°俯视角：高度 ≈ 水平距离
const CAM_OFF=new THREE.Vector3(0,34,34);

const hemi=new THREE.HemisphereLight(0xbcd3ff,0x3a2f22,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.9);
sun.position.set(40,70,20); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80;
sun.shadow.camera.far=220; sun.shadow.bias=-0.0004;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223349,.5));

/* ================= 物理世界 ================= */
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-22,0)});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=.45;
world.defaultContactMaterial.restitution=.08;
const matGround=new CANNON.Material('ground'), matBox=new CANNON.Material('box');
world.addContactMaterial(new CANNON.ContactMaterial(matGround,matBox,{friction:.5,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(matBox,matBox,{friction:.4,restitution:.12}));

const ARENA=92; // 半径
(function ground(){
  const b=new CANNON.Body({mass:0,material:matGround,shape:new CANNON.Plane()});
  b.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(b);
  // 四周围墙（隐形）
  const wallMat=new CANNON.Material('wall');
  const mk=(x,z,w,d)=>{ const wb=new CANNON.Body({mass:0,material:wallMat});
    wb.addShape(new CANNON.Box(new CANNON.Vec3(w/2,6,d/2))); wb.position.set(x,4,z); world.addBody(wb); };
  mk(0,-ARENA-2,ARENA*2+20,4); mk(0,ARENA+2,ARENA*2+20,4);
  mk(-ARENA-2,0,4,ARENA*2+20); mk(ARENA+2,0,4,ARENA*2+20);
})();

/* ---- 地面纹理：草地 + 街区道路 ---- */
function groundTexture(){
  const c=document.createElement('canvas'); c.width=c.height=1024;
  const g=c.getContext('2d');
  g.fillStyle='#3d5a34'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(${40+Math.random()*40|0},${90+Math.random()*50|0},${40+Math.random()*30|0},.5)`;
    g.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  g.fillStyle='#2c2f36'; // 横竖主干道
  g.fillRect(0,472,1024,80); g.fillRect(472,0,80,1024);
  g.fillStyle='#3a3e46'; g.fillRect(0,200,1024,44); g.fillRect(200,0,44,1024); g.fillRect(0,780,1024,44); g.fillRect(780,0,44,1024);
  g.strokeStyle='#e8d44f'; g.lineWidth=4; g.setLineDash([26,20]);
  g.beginPath(); g.moveTo(0,512); g.lineTo(1024,512); g.moveTo(512,0); g.lineTo(512,1024); g.stroke();
  g.setLineDash([]); g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2;
  for(const y of [200,780]){ g.beginPath(); g.moveTo(0,y+22); g.lineTo(1024,y+22); g.stroke(); }
  for(const x of [200,780]){ g.beginPath(); g.moveTo(x+22,0); g.lineTo(x+22,1024); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4; return t;
}
{
  const gm=new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2+30,ARENA*2+30),
    new THREE.MeshStandardMaterial({map:groundTexture(),roughness:.95,metalness:0}));
  gm.rotation.x=-Math.PI/2; gm.receiveShadow=true; scene.add(gm);
}

/* ================= 注册表 ================= */
const destructibles=new Map(); // body.id -> {body, group, hp, maxHp, score, kind, size, color}
const debris=[];               // {mesh, body, life}
const fallings=[];             // 倒塌中的楼层块 {mesh, body, life}
const cars=[];
let score=0, kills=0, comboN=0, comboT=0, won=false;

function updateHUD(){
  scoreEl.textContent=score;
  let left=0; destructibles.forEach(d=>{ if(d.kind==='building') left++; });
  leftEl.textContent=left;
  if(left===0&&!won){ won=true; crashBig(); toast('整座城被推平了，按 N 重建',4000); }
}
function addScore(n,x,z,label){
  score+=n; floatText('+'+n+(label||''),x,z);
  updateHUD();
}
// 飘字
const floaters=[];
function floatText(text,x,z){
  const c=document.createElement('canvas'); c.width=256; c.height=96;
  const g=c.getContext('2d'); g.font='bold 52px sans-serif'; g.textAlign='center';
  g.lineWidth=8; g.strokeStyle='rgba(0,0,0,.7)'; g.strokeText(text,128,62);
  g.fillStyle='#ffd54a'; g.fillText(text,128,62);
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false});
  const s=new THREE.Sprite(m); s.scale.set(7,2.6,1);
  s.position.set(x,9,z); scene.add(s);
  floaters.push({s,life:1.3});
}

/* ---- 尘土粒子池（Points） ---- */
const DUST_N=900;
const dustPos=new Float32Array(DUST_N*3), dustVel=new Float32Array(DUST_N*3), dustLife=new Float32Array(DUST_N);
dustPos.fill(-999);
const dustGeo=new THREE.BufferGeometry();
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
function dustTexture(){ const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,2,32,32,30);
  gr.addColorStop(0,'rgba(220,210,195,.85)'); gr.addColorStop(1,'rgba(220,210,195,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
const dustPts=new THREE.Points(dustGeo,new THREE.PointsMaterial({size:2.6,map:dustTexture(),
  transparent:true,opacity:.75,depthWrite:false}));
dustPts.frustumCulled=false; scene.add(dustPts);
let dustCursor=0;
function puff(x,y,z,n=14,spread=5,up=7){
  for(let i=0;i<n;i++){ const k=dustCursor=(dustCursor+1)%DUST_N;
    dustPos[k*3]=x+(Math.random()-.5)*2; dustPos[k*3+1]=y+Math.random(); dustPos[k*3+2]=z+(Math.random()-.5)*2;
    dustVel[k*3]=(Math.random()-.5)*spread; dustVel[k*3+1]=Math.random()*up; dustVel[k*3+2]=(Math.random()-.5)*spread;
    dustLife[k]=.8+Math.random()*.9; }
}
function updateDust(dt){
  for(let k=0;k<DUST_N;k++){ if(dustLife[k]<=0) continue;
    dustLife[k]-=dt; dustVel[k*3+1]-=2*dt;
    dustPos[k*3]+=dustVel[k*3]*dt; dustPos[k*3+1]+=dustVel[k*3+1]*dt; dustPos[k*3+2]+=dustVel[k*3+2]*dt;
    if(dustLife[k]<=0||dustPos[k*3+1]<0) { dustLife[k]=0; dustPos[k*3+1]=-999; } }
  dustGeo.attributes.position.needsUpdate=true;
}

/* ================= 建材 ================= */
const M={
  wall:new THREE.MeshStandardMaterial({color:0xd8cfc0,roughness:.9}),
  brick:new THREE.MeshStandardMaterial({color:0xb6654e,roughness:.9}),
  concrete:new THREE.MeshStandardMaterial({color:0x9aa3b2,roughness:.95}),
  glass:new THREE.MeshStandardMaterial({color:0x9fd8e8,roughness:.15,metalness:.35,emissive:0x2a4a5a,emissiveIntensity:.35}),
  roof:new THREE.MeshStandardMaterial({color:0x39414f,roughness:.9}),
  wood:new THREE.MeshStandardMaterial({color:0x9a6b3f,roughness:.9}),
  yellow:new THREE.MeshStandardMaterial({color:0xf2b705,roughness:.5,metalness:.25}),
  darkMetal:new THREE.MeshStandardMaterial({color:0x2b2f36,roughness:.6,metalness:.6}),
  track:new THREE.MeshStandardMaterial({color:0x1c1e22,roughness:.95}),
  cabinGlass:new THREE.MeshStandardMaterial({color:0x8fd4ef,roughness:.1,metalness:.4,emissive:0x1c3a4a,emissiveIntensity:.5}),
  trunk:new THREE.MeshStandardMaterial({color:0x6b4a2c,roughness:1}),
  leaf:new THREE.MeshStandardMaterial({color:0x4c8a3f,roughness:1}),
  tire:new THREE.MeshStandardMaterial({color:0x17181c,roughness:.95}),
};
function box(w,h,d,mat,x=0,y=0,z=0,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; return m;
}
function addStaticBox(group,cx,cy,cz,w,h,d){
  const body=new CANNON.Body({mass:0,material:matBox});
  body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));
  body.position.set(cx,cy,cz); body.allowSleep=true; body.sleep();
  world.addBody(body); return body;
}

/* ---- 高精度楼房 ---- */
function makeBuilding(cx,cz,w,h,d,style){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const baseMat = style==='brick'?M.brick : style==='glass'?M.glass : style==='concrete'?M.concrete : M.wall;
  const base=box(w,h,d,baseMat,0,h/2,0); base.name='base'; g.add(base);
  const winMat=new THREE.MeshStandardMaterial({color:0x1d2b3d,roughness:.3,metalness:.3,emissive:0xffdf8a,emissiveIntensity:style==='glass'?.55:.22});
  const frameMat=new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.8});
  const floors=Math.max(2,Math.floor(h/3.2)), cols=Math.max(2,Math.floor(w/2.6));
  const winGeo=new THREE.BoxGeometry(1.1,1.3,.12);
  for(let f=0;f<floors;f++) for(let cI=0;cI<cols;cI++){
    const wx=-w/2+ (cI+.5)*(w/cols), wy=2+f*((h-3)/floors);
    for(const s of [1,-1]){
      const win=new THREE.Mesh(winGeo, (f+cI)%4===0?frameMat:winMat);
      win.position.set(wx,wy,s*(d/2+.04)); g.add(win);
    }
  }
  const colsD=Math.max(2,Math.floor(d/2.6));
  for(let f=0;f<floors;f++) for(let cI=0;cI<colsD;cI++){
    const wz=-d/2+(cI+.5)*(d/colsD), wy=2+f*((h-3)/floors);
    for(const s of [1,-1]){
      const win=new THREE.Mesh(winGeo,(f*2+cI)%5===0?frameMat:winMat);
      win.rotation.y=Math.PI/2; win.position.set(s*(w/2+.04),wy,wz); g.add(win);
    }
  }
  g.add(box(w*.7,2.2,.3,frameMat,0,1.1,d/2+.08));
  g.add(box(2.2,2,.4,M.darkMetal,0,1,d/2+.1));
  g.add(box(w+.4,.7,d+.4,M.roof,0,h+.3,0));
  g.add(box(1.8,1.2,1.8,M.concrete, w/4,h+1.1,-d/5));
  const tankMat=new THREE.MeshStandardMaterial({color:0x7a5230,roughness:.8});
  const tank=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.8,14),tankMat);
  tank.position.set(-w/4,h+1.4,d/5); tank.castShadow=true; g.add(tank);
  scene.add(g);
  const body=addStaticBox(g,cx,h/2,cz,w,h,d);
  const hp=Math.round(2+h/5);
  destructibles.set(body.id,{body,group:g,hp,maxHp:hp,score:120+Math.round(w*h*d/22),kind:'building',
    size:{w,h,d},color:baseMat.color.clone(),state:'stand',fallTimer:0});
  return body;
}
function makeWallRun(x1,z1,x2,z2){
  const len=Math.hypot(x2-x1,z2-z1), n=Math.max(1,Math.round(len/4));
  for(let i=0;i<n;i++){ const t=(i+.5)/n, cx=x1+(x2-x1)*t, cz=z1+(z2-z1)*t;
    const g=new THREE.Group(); g.position.set(cx,0,cz);
    g.rotation.y=Math.atan2(x2-x1,z2-z1)+Math.PI/2;
    g.add(box(4,2.2,.6,M.brick,0,1.1,0));
    g.add(box(4.3,.3,.8,M.concrete,0,2.3,0));
    scene.add(g);
    const body=addStaticBox(g,cx,1.1,cz,4,2.2,.6);
    destructibles.set(body.id,{body,group:g,hp:1,maxHp:1,score:40,kind:'wall',size:{w:4,h:2.2,d:.6},color:new THREE.Color(0xb6654e),state:'stand',fallTimer:0});
  }
}
function makeCrate(cx,cz,s=1.6){
  const g=new THREE.Group(); g.position.set(cx,0,cz); g.rotation.y=Math.random()*1;
  g.add(box(s,s,s,M.wood,0,s/2,0));
  g.add(box(s+.1,.18,s+.1,M.darkMetal,0,s-.1,0));
  scene.add(g);
  const body=addStaticBox(g,cx,s/2,cz,s,s,s);
  destructibles.set(body.id,{body,group:g,hp:1,maxHp:1,score:25,kind:'crate',size:{w:s,h:s,d:s},color:new THREE.Color(0x9a6b3f),state:'stand'});
}
function makeTree(cx,cz){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,3,8),M.trunk);
  trunk.position.y=1.5; trunk.castShadow=true; g.add(trunk);
  const c1=new THREE.Mesh(new THREE.ConeGeometry(2.4,3.4,10),M.leaf); c1.position.y=4.2; c1.castShadow=true; g.add(c1);
  const c2=new THREE.Mesh(new THREE.ConeGeometry(1.7,2.6,10),M.leaf); c2.position.y=6; c2.castShadow=true; g.add(c2);
  scene.add(g);
  const body=addStaticBox(g,cx,2,cz,1,4,1);
  destructibles.set(body.id,{body,group:g,hp:1,maxHp:1,score:20,kind:'tree',size:{w:1.5,h:5,d:1.5},color:new THREE.Color(0x4c8a3f),state:'stand'});
}
function makeLamp(cx,cz){
  const g=new THREE.Group(); g.position.set(cx,0,cz);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,7,10),M.darkMetal);
  pole.position.y=3.5; pole.castShadow=true; g.add(pole);
  g.add(box(1.6,.3,.5,M.darkMetal,.6,6.9,0));
  const bulbMat=new THREE.MeshStandardMaterial({color:0xfff2c0,emissive:0xffd54a,emissiveIntensity:1.6});

// 撞击在 step 后从 world.contacts 快照读取：cannon-es 的 collide 回调里读
// getImpactVelocityAlongNormal 会因方程复用抛错，这是之前报错的真正病根。
const pendingHits=[];
function onDozerCollide(e){ /* 仅保留监听以唤醒，无读取 */ }
function drainCollideEvents(){
  const b=dozer.body;
  const contacts=b.world ? b.world.contacts : [];
  for(const c of contacts){
    const o=(c.bi===b)?c.bj:c.bi;
    if(!o || o.id===undefined) continue;
    if(c.bi!==b && c.bj!==b) continue;
    let v=0; try{ v=Math.abs(c.getImpactVelocityAlongNormal()||0); }catch(_){ continue; }
    if(!isFinite(v)||v<=0) continue;
    const d=destructibles.get(o.id);
    const spd=Math.abs(dozer.speed);
    if(d){ if(v>2.2||spd>5) pendingHits.push({d,v,spd}); }
    else if(v>6) pendingHits.push({d:null,v,spd});
  }
}
function processHits(){
  for(let i=0;i<pendingHits.length;i++){
    const h=pendingHits[i];
    const {d,v,spd}=h;
    if(d){
      if(d.hp<=0 || !destructibles.has(d.body.id)) continue;
      const hard=spd>11||v>8;
      damageDestructible(d, hard?2:1, v, true);
      if(v>3){ thump(Math.min(1,v/12)); shakeCam(Math.min(1.2,v*.07)); }
    } else {
      thump(.5); shakeCam(.6); puff(dozer.body.position.x,1,dozer.body.position.z,8,6,5);
    }
  }
  pendingHits.length=0;
}

const fragMats=new Map();
function fragMat(color){ const k=color.getHex();
  if(!fragMats.has(k)) fragMats.set(k,new THREE.MeshStandardMaterial({color,roughness:.9}));
  return fragMats.get(k); }
// 小物件：直接压扁（cannon 里是 static body，只做视觉压扁 + 计分，不走碎裂）
function squashSmall(d, dirX, dirZ){
  const p=d.body.position.clone();
  destructibles.delete(d.body.id);
  world.removeBody(d.body); scene.remove(d.group);
  kills++;

  const s=d.size;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.4,s.w*.85),.18,Math.max(.4,s.d*.85)),fragMat(d.color));
  mesh.position.set(p.x,.1,p.z);
  mesh.rotation.y=Math.random()*Math.PI;
  scene.add(mesh);
  fallings.push({mesh,body:null,life:6,flat:true});
  // 碎屑 + 尘
  puff(p.x,1,p.z,8,4,5);
  for(let i=0;i<4;i++) spawnDebrisChunk(p.x,.8,p.z,d.color,.5);

}
function damageDestructible(d,dmg,impactV=5,byDozer=false){
  if(d.hp<=0 || d.state==='falling' || d.falling) return;
  // 小物件（树/灯/箱/墙）：血量打空直接压扁，不走楼房倒塌流程
  if(d.kind==='tree'||d.kind==='lamp'||d.kind==='crate'||d.kind==='wall'){
    d.hp-=dmg;
    const p=d.body.position;
    puff(p.x,Math.max(1.5,d.size.h*.6),p.z,6,4,5);
    if(d.hp>0){
      d.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ o.material=o.material.clone();
        o.material.emissive=new THREE.Color(0xaa6611); o.material.emissiveIntensity=.6;
        setTimeout(()=>{o.material.emissiveIntensity=0;},120); } });
      return;
    }
    squashSmall(d);
    return;
  }
  d.hp-=dmg;
  const p=d.body.position;
  puff(p.x,Math.max(1.5,d.size.h*.6),p.z,6,4,5);
  // 阶段一：墙体碎裂——掉渣 + 裂纹变暗
  if(d.hp>0){
    spawnDebrisChunk(p.x,p.y||3,p.z,d.color,Math.min(d.size.w,d.size.d)*.4);
    d.group.traverse(o=>{ if(o.isMesh&&o.material.emissive!==undefined){ o.material=o.material.clone();
      o.material.emissive=new THREE.Color(0xff5522); o.material.emissiveIntensity=.55;
      setTimeout(()=>{o.material.emissiveIntensity=.15;},160); } });
    // 越残越晃：整体倾斜一点，预告倒塌
    const dmgRatio=1-d.hp/d.maxHp;
    d.group.rotation.z=(Math.random()-.5)*.05*dmgRatio;
    return;
  }
  // 阶段二+三：整体倒塌成可推动的楼块，再碎成块（见 toppleBuilding）
  toppleBuilding(d,impactV);
}
let camShake=0; function shakeCam(n){ camShake=Math.min(1.6,camShake+n); }
// 楼房倒塌：整栋变成动态刚体向前扑倒，落地后碎裂成块，块再慢慢消失
function toppleBuilding(d,impactV=8){
  const p=d.body.position.clone(), s=d.size;
  destructibles.delete(d.body.id);
  world.removeBody(d.body); scene.remove(d.group);
  kills++;
  if(comboT>0) comboN++; else comboN=1;
  comboT=1.4;
  addScore(d.score+(comboN>=2?comboN*30:0),p.x,p.z,comboN>=2?(' x'+comboN):'');
  if(comboN===3) crashBig();
  // 倒塌块：按楼层切 2~4 段，每段都是可碰撞刚体，向撞击方向倾倒
  const segs=Math.min(4,Math.max(2,Math.round(s.h/5)));
  const segH=s.h/segs;
  const dir=new THREE.Vector3(dozer.body.position.x-p.x,0,dozer.body.position.z-p.z).normalize();
  if(dir.lengthSq()<.01) dir.set(0,0,1);
  for(let i=0;i<segs;i++){
    const cy=p.y-s.h/2+segH*(i+.5);
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(s.w,segH,s.d),fragMat(d.color.clone().offsetHSL(0,0,(Math.random()-.5)*.08)));
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.position.set(p.x,cy,p.z);
    scene.add(mesh);
    const body=new CANNON.Body({mass:8+segH*2,material:matBox});
    body.addShape(new CANNON.Box(new CANNON.Vec3(s.w/2,segH/2,s.d/2)));
    body.position.set(p.x,cy,p.z);
    // 高处块倒得更快：顶层先翻，形成压塌效果
    const topBoost=1+(i/(segs-1||1))*3;
    body.velocity.set(dir.x*(3+impactV*.3)*topBoost,1.5,dir.z*(3+impactV*.3)*topBoost);
    body.angularVelocity.set(dir.z*1.2*topBoost,0,-dir.x*1.2*topBoost);
    body.angularDamping=.25; body.linearDamping=.05; body.allowSleep=false;
    world.addBody(body);
    fallings.push({mesh,body,life:9+Math.random()*2,big:true});
  }
  puff(p.x,3,p.z,40,9,10);
  puff(p.x,6,p.z,16,10,12);
  crashBig(); shakeCam(1.2);
  updateHUD();
}

  const s=(keys['a']||keys['arrowleft']?1:0)+(keys['d']||keys['arrowright']?-1:0);
  const brake=!!keys[' '];
  return {throttle:f,steer:s,brake};
}

/* ================= 主循环 ================= */
buildDozerMesh(); buildDozerBody(0,30); buildCity();
$('loading').style.display='none';
// 诊断探针（控制台用，不打扰玩家）：window.__diag()
window.__T = THREE; window.__R = renderer; window.__S = scene; window.__C = camera;
window.__diag = () => ({ meshes: (()=>{let n=0; scene.traverse(o=>{if(o.isMesh)n++}); return n;})(),
  bodies: world.bodies.length, destr: destructibles.size,
  info: renderer.info.render,
  dozer: dozer.body? [dozer.body.position.x.toFixed(1), dozer.body.position.y.toFixed(1), dozer.body.position.z.toFixed(1)] : null,
  cam: camera.position.toArray().map(v=>+v.toFixed(1)), camTarget: camTarget.toArray().map(v=>+v.toFixed(1)) });
setTimeout(()=>{ const h=$('hint'); if(h) h.style.display='none'; },6000);
setTimeout(()=>toast('开上推土机撞过去，车速越快碎得越彻底',4200),300);

const clock=new THREE.Clock();
const fwd=new THREE.Vector3(), q=new THREE.Quaternion(), camTarget=new THREE.Vector3(0,0,30);
let exhaustT=0;
const MAX_DEBRIS_VEL=40;
// 转向平滑：避免直接写角速度导致的卡顿跳变
let steerSm=0;

function step(dt){
  // -- 驾驶 --
  const {throttle,steer,brake}=readInput();
  const b=dozer.body;
  const MAXS=46;
  const target=brake?0:throttle*MAXS;
  const accel=brake?90:(Math.abs(target)>Math.abs(dozer.speed)?55:70);
  dozer.speed+=Math.sign(target-dozer.speed)*Math.min(Math.abs(target-dozer.speed),accel*dt);
  if(throttle===0&&!brake) dozer.speed*=Math.max(0,1-0.25*dt);
  const spdAbs=Math.abs(dozer.speed);
  const wantFov=50+Math.min(14,spdAbs*.35);
  if(Math.abs(camera.fov-wantFov)>.1){ camera.fov+=(wantFov-camera.fov)*Math.min(1,dt*4); camera.updateProjectionMatrix(); }
  // 前方向（物理四元数）
  q.copy(b.quaternion);
  fwd.set(0,0,1).applyQuaternion(q); fwd.y=0;
  if(fwd.lengthSq()<.01) fwd.set(0,0,1); fwd.normalize();
  b.velocity.x=fwd.x*dozer.speed; b.velocity.z=fwd.z*dozer.speed;
  if(Math.abs(b.velocity.y)>30) b.velocity.y=Math.sign(b.velocity.y)*30;
  // 转向：平滑后的转向角速度 + 侧倾车身，比直接改角速度顺滑得多；
  // 坦克式：低速也能原地转向，高速转弯半径自动变大
  steerSm+=(steer-steerSm)*Math.min(1,dt*7);
  const dirSign=dozer.speed<-1?-1:1;
  const yawRate=steerSm*(1.1+Math.min(1.6,spdAbs*.09))*dirSign*(brake?0:1);
  // 用四元数小步旋转代替直接设角速度：无跳变、不打架
  if(Math.abs(yawRate)>.001){
    const dq=new CANNON.Quaternion();
    dq.setFromEuler(0,yawRate*dt,0);
    b.quaternion=b.quaternion.mult(dq);
    b.angularVelocity.set(b.angularVelocity.x*.5,0,b.angularVelocity.z*.5);
  } else {
    b.angularVelocity.set(b.angularVelocity.x*.5,0,b.angularVelocity.z*.5);
  }
  // 防翻：把上向量拉回 +Y
  const up=new CANNON.Vec3(0,1,0); b.quaternion.vmult(up,up);
  if(up.y<.55){
    b.applyTorque(new CANNON.Vec3(up.z*2200,0,-up.x*2200));
    if(!step._tipped){ step._tipped=true; toast('翻车了，按 R 扶正',2500); setTimeout(()=>step._tipped=false,3000); }
  }
  b.wakeUp();

  // -- 物理 --
  world.step(1/60,dt,3);
  drainCollideEvents(); processHits();
  // 碎块限速 + 超时清理
  for(let i=debris.length-1;i>=0;i--){ const o=debris[i]; o.life-=dt;
    const v=o.body.velocity, sp=v.length();
    if(sp>MAX_DEBRIS_VEL) v.scale(MAX_DEBRIS_VEL/sp,v);
    if(o.life<=0){ scene.remove(o.mesh); world.removeBody(o.body); debris.splice(i,1);
      o.mesh.geometry.dispose(); continue; }
    if(o.life<1.2){ const s=Math.max(.01,o.life/1.2); o.mesh.scale.setScalar(s); }
  }
  // 倒塌块：落地（高度低 + 速度慢）或超时 → 碎成小块
  for(let i=fallings.length-1;i>=0;i--){ const f=fallings[i]; f.life-=dt;
    if(f.flat){ if(f.life<=0){ scene.remove(f.mesh); fallings.splice(i,1); } continue; }
    const sp=f.body.velocity.length();
    const low=f.body.position.y<3&&sp<4;
    if(low||f.life<=0){ shatterFalling(f,sp); continue; }
    if(f.life<1.5){ const s=Math.max(.3,f.life/1.5); f.mesh.scale.setScalar(s); }
  }
  comboT=Math.max(0,comboT-dt); if(comboT===0&&comboN!==0){comboN=0;}

  // -- 同步网格 --
  dozer.group.position.copy(b.position); dozer.group.quaternion.copy(b.quaternion);
  destructibles.forEach(d=>{ if(d.kind==='car'){ d.group.position.copy(d.body.position); d.group.quaternion.copy(d.body.quaternion);
    const sp2=d.body.velocity.length();
    if(sp2>9&&!d._hit){ d._hit=true; setTimeout(()=>d._hit=false,600);
      if(sp2>13){ d.hp-=1; puff(d.body.position.x,2,d.body.position.z,10,6,7); clank(); shakeCam(.4);
        if(d.hp<=0&&!d.wrecked){ d.wrecked=true; demolish(d,sp2); } } }
  }});
  debris.forEach(o=>{ o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion); });
  fallings.forEach(f=>{ if(f.body){ f.mesh.position.copy(f.body.position); f.mesh.quaternion.copy(f.body.quaternion); } });
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt;
    f.s.position.y+=dt*3; f.s.material.opacity=Math.min(1,f.life);
    if(f.life<=0){ scene.remove(f.s); floaters.splice(i,1); } }

  // -- 特效 --
  updateDust(dt);
  const spd=Math.abs(dozer.speed);
  spdEl.textContent=Math.round(spd*3.6);
  engineUpdate(dozer.speed,throttle);
  const roll=dozer.speed*.55;
  dozer.wheels.forEach(w=>{ w.rotation.x+=roll*dt; });
  exhaustT-=dt;
  if((throttle!==0||spd>6)&&exhaustT<=0){ exhaustT=.09;
    const tip=new THREE.Vector3(); dozer.exhaustTip.getWorldPosition(tip);
    puff(tip.x,tip.y,tip.z,1,1,2.5); }
  if(spd>10&&Math.random()<.5){ puff(b.position.x-fwd.x*2,.6,b.position.z-fwd.z*2,2,5,4); }

  // -- 45°俯视跟随相机 + 震屏 --
  camTarget.lerp(new THREE.Vector3(b.position.x,0,b.position.z).addScaledVector(fwd,4),1-Math.pow(.001,dt));
  camShake=Math.max(0,camShake-dt*8);
  const sh=camShake>0?new THREE.Vector3((Math.random()-.5)*camShake*.5,(Math.random()-.5)*camShake*.2,(Math.random()-.5)*camShake*.5):new THREE.Vector3();
  camera.position.copy(camTarget).add(CAM_OFF).add(sh);
  camera.lookAt(camTarget.x+sh.x,0,camTarget.z+sh.z);
  sun.position.set(camTarget.x+40,70,camTarget.z+20);
  sun.target.position.set(camTarget.x,0,camTarget.z); sun.target.updateMatrixWorld();
}

function frame(){
  // 物理错误只记控制台，不再弹条打扰玩家
  requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta());
  try{ step(dt); }catch(err){ console.error('[physics]',err); }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
document.addEventListener('pointerdown',()=>{ac();engineStart();},{once:true});
frame();
</script>
</body>
</html>
